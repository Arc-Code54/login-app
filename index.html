<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="container">
        <section class="left">
            <!-- <div class="icon">
                <img src="images/black.png" alt="">
            </div> -->
            <div class="banner-heading">
                <p>
                    " everything you want to know is here "
                </p>
            </div>
        </section>
        <section class="right">
            <h1>Get Started</h1>
            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Obcaecati, dolor.
            </p>

            <div class="social-buttons">
                <button class="btn">Sign in with Google  <i class="fa-brands fa-google"></i></button>
                <button class="btn">Sign in with Apple <i class="fa-brands fa-apple"></i></button>
            </div>

            <div class="form">
                <form action="" id="sign-up">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="example@gmail.com">

                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="********">

                    <button class="btn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Sign in</button>
                </form>

                <p>
                    By signing up, you agree to our <a href="">terms of services</a> & <a href="">privacy policy</a>
                </p>

                <br>

                <a href="#">Have an account? Sign up</a>
            </div>
        </section>
    </main>
</body>
</html>
